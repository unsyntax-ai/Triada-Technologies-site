name: Daily insight

on:
  schedule:
    - cron: "15 12 * * *"   # every day, 12:15 UTC
  push:
    branches: [main]        # rebuild pages whenever files are uploaded, so the list never goes stale
  workflow_dispatch:          # lets you run it by hand from the Actions tab
    inputs:
      redo_art:
        description: "Only redraw the illustrations of existing articles"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: insights
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write today's insight
        if: github.event_name != 'push'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python3 scripts/generate_insights.py ${{ inputs.redo_art && '--redo-art' || '' }}
      - name: Rebuild the site
        run: python3 build.py
      - name: Commit changes
        run: |
          git config user.name "Triada Insights Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Nothing to save." && exit 0
          git commit -m "Daily insight update"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1
