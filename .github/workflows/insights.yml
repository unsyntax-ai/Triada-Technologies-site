name: Daily insight

on:
  schedule:
    - cron: "15 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: insights
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Write today's insight
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python3 scripts/generate_insights.py
      - name: Rebuild the site
        run: python3 build.py
      - name: Commit changes
        run: |
          git config user.name "Triada Insights Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Daily insight update"
          git push
